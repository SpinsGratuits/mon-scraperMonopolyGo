name: Script de Scraping Périodique

on:
  schedule:
    # Exécution à 08:00 et 20:00 (Heure française)
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # MODIFICATION ICI : On installe cloudscraper en plus des autres
    - name: Installer les librairies
      run: |
        python -m pip install --upgrade pip
        pip install beautifulsoup4 cloudscraper

    - name: Lancer le scraper
      run: python scraper.py

    - name: Sauvegarder les modifications dans le dépôt
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add scrapmonopolygo.json
        git commit -m "Mise à jour automatique des données : $(date +'%Y-%m-%d')" || exit 0
        git push
